<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYRA - Ecobags</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-category="ecobags">
    <main>
        <!-- Category Hero Section -->
        <section class="category-hero">
            <img src="https://media.base44.com/images/public/6a6110c7082124fafbd842f3/6996ffc2b_generated_777c3279.png"
                class="category-hero-bg" alt="Ecobags">
            <div class="category-hero-overlay"></div>

            <div class="category-hero-content">
                <h1 class="font-display">Ecobags</h1>
                <p>Canvas orgânico de alta durabilidade. Funcionalidade com elegância.</p>
            </div>
        </section>

        <!-- Catalog Section -->
        <section class="catalog-section">
            <div class="container catalog-layout">
                <!-- Sidebar Filters -->
                <aside class="sidebar-filters" id="filters-container">
                    <!-- Filters injected via JS -->
                </aside>

                <!-- Product Grid -->
                <div class="catalog-grid-container">
                    <div class="vitrine-grid" id="category-products">
                        <!-- Products injected via JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
