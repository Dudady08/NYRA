<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYRA - Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background">
    <!-- Invalid Token View (hidden initially) -->
    <div id="invalid-token-view" class="auth-layout-container hidden">
        <div class="auth-layout-content">
            <div class="auth-header">
                <div class="auth-icon-wrapper">
                    <i data-lucide="alert-triangle" class="auth-icon"></i>
                </div>
                <h1 class="auth-title font-display">Invalid reset link</h1>
                <p class="auth-subtitle">This password reset link is missing or invalid</p>
            </div>
            <div class="auth-card">
                <p class="text-sm text-foreground text-center">
                    The link you used appears to be incomplete. Please request a new password reset email.
                </p>
            </div>
            <div class="auth-footer">
                <a href="forgot-password.html" class="text-primary font-medium hover-underline">Request a new link</a>
            </div>
        </div>
    </div>

    <!-- Reset Password View (hidden initially) -->
    <div id="reset-password-view" class="auth-layout-container hidden">
        <div class="auth-layout-content">
            <div class="auth-header">
                <div class="auth-icon-wrapper">
                    <i data-lucide="lock" class="auth-icon"></i>
                </div>
                <h1 class="auth-title font-display">New password</h1>
                <p class="auth-subtitle">Enter your new password below</p>
            </div>
            <div class="auth-card">
                <div id="reset-error" class="auth-error hidden"></div>
                
                <form id="reset-form" class="auth-form space-y-4">
                    <div class="auth-form-group">
                        <label for="password" class="auth-label">New Password</label>
                        <div class="auth-input-wrapper">
                            <i data-lucide="lock" class="auth-input-icon"></i>
                            <input type="password" id="password" class="auth-input" placeholder="••••••••" required autofocus>
                        </div>
                    </div>
                    <div class="auth-form-group">
                        <label for="confirm" class="auth-label">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <i data-lucide="lock" class="auth-input-icon"></i>
                            <input type="password" id="confirm" class="auth-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" id="reset-btn" class="auth-button">
                        <span id="reset-btn-text">Reset password</span>
                        <i data-lucide="loader-2" id="reset-spinner" class="animate-spin hidden" style="width:1rem;height:1rem;margin-right:0.5rem;"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
