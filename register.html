<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYRA - Create Account</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background">
    <!-- Registration Form View -->
    <div id="register-view" class="auth-layout-container">
        <div class="auth-layout-content">
            
            <div class="auth-header">
                <div class="auth-icon-wrapper">
                    <i data-lucide="user-plus" class="auth-icon"></i>
                </div>
                <h1 class="auth-title font-display">Create your account</h1>
                <p class="auth-subtitle">Sign up to get started</p>
            </div>

            <div class="auth-card">
                <button type="button" id="google-register-btn" class="auth-button-outline">
                    <svg class="icon-google" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4" />
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-separator">
                    <div class="auth-separator-line"><div></div></div>
                    <div class="auth-separator-text">
                        <span>or</span>
                    </div>
                </div>

                <div id="register-error" class="auth-error hidden"></div>

                <form id="register-form" class="auth-form space-y-4">
                    <div class="auth-form-group">
                        <label for="email" class="auth-label">Email</label>
                        <div class="auth-input-wrapper">
                            <i data-lucide="mail" class="auth-input-icon"></i>
                            <input type="email" id="email" class="auth-input" placeholder="you@example.com" required autofocus>
                        </div>
                    </div>
                    <div class="auth-form-group">
                        <label for="password" class="auth-label">Password</label>
                        <div class="auth-input-wrapper">
                            <i data-lucide="lock" class="auth-input-icon"></i>
                            <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="auth-form-group">
                        <label for="confirm" class="auth-label">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <i data-lucide="lock" class="auth-input-icon"></i>
                            <input type="password" id="confirm" class="auth-input" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" id="register-btn" class="auth-button">
                        <span id="register-btn-text">Create account</span>
                        <i data-lucide="loader-2" id="register-spinner" class="animate-spin hidden" style="width:1rem;height:1rem;margin-right:0.5rem;"></i>
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html" class="text-primary font-medium hover-underline">Log in</a>
            </div>
        </div>
    </div>

    <!-- OTP Verification View (hidden initially) -->
    <div id="otp-view" class="auth-layout-container hidden">
        <div class="auth-layout-content">
            
            <div class="auth-header">
                <div class="auth-icon-wrapper">
                    <i data-lucide="mail" class="auth-icon"></i>
                </div>
                <h1 class="auth-title font-display">Verify your email</h1>
                <p class="auth-subtitle" id="otp-subtitle">We sent a code to ...</p>
            </div>

            <div class="auth-card">
                <div id="otp-error" class="auth-error hidden"></div>
                <div id="otp-success" class="auth-success hidden">Code sent. Check your email for the new code.</div>
                
                <div class="otp-input-group mb-6">
                    <input type="text" maxlength="1" class="otp-slot">
                    <input type="text" maxlength="1" class="otp-slot">
                    <input type="text" maxlength="1" class="otp-slot">
                    <input type="text" maxlength="1" class="otp-slot">
                    <input type="text" maxlength="1" class="otp-slot">
                    <input type="text" maxlength="1" class="otp-slot">
                </div>

                <button type="button" id="verify-btn" class="auth-button" disabled>
                    <span id="verify-btn-text">Verify</span>
                    <i data-lucide="loader-2" id="verify-spinner" class="animate-spin hidden" style="width:1rem;height:1rem;margin-right:0.5rem;"></i>
                </button>

                <p class="text-center text-sm text-muted-foreground mt-4">
                    Didn't receive the code? 
                    <button type="button" id="resend-btn" class="btn-link-underline border-0 bg-transparent cursor-pointer font-medium p-0" style="color: var(--foreground);">Resend</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container hidden">
        <p class="toast-title">Code sent</p>
        <p class="toast-desc">Check your email for the new code.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
