<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYRA - Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="auth-layout-container">
        <div class="auth-card-wrapper">
            <div class="auth-header">
                <div class="auth-icon-wrapper">
                    <i data-lucide="mail"></i>
                </div>
                <h1 class="auth-title">Reset password</h1>
                <p class="auth-subtitle">We'll send you a link to reset it</p>
            </div>
            
            <div class="auth-card">
                <!-- Sent state (hidden by default) -->
                <p id="forgot-password-sent" class="text-sm text-center hidden">
                    If an account exists with that email, you'll receive a password reset link shortly.
                </p>

                <!-- Form -->
                <form id="forgot-password-form" class="auth-form">
                    <div class="auth-form-group">
                        <label for="email" class="auth-label">Email address</label>
                        <div class="auth-input-relative">
                            <i data-lucide="mail" class="auth-input-icon"></i>
                            <input
                                id="email"
                                type="email"
                                autocomplete="email"
                                autofocus
                                placeholder="you@example.com"
                                required
                                class="auth-input"
                            >
                        </div>
                    </div>
                    <button type="submit" class="auth-button" id="forgot-password-btn">
                        <span id="forgot-password-btn-text">Send reset link</span>
                        <div id="forgot-password-spinner" class="hidden">
                            <i data-lucide="loader-2" class="animate-spin" style="width:1rem;height:1rem;margin-right:0.5rem"></i>
                            Sending...
                        </div>
                    </button>
                </form>
            </div>
            
            <p class="auth-footer">
                <a href="login.html" class="auth-link auth-link-back">
                    <i data-lucide="arrow-left" style="width:0.75rem;height:0.75rem;margin-right:0.25rem;"></i>
                    Back to log in
                </a>
            </p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
