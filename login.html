<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYRA - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="auth-layout-container">
        <div class="auth-card-wrapper">
            <div class="auth-header">
                <div class="auth-icon-wrapper">
                    <i data-lucide="log-in"></i>
                </div>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Log in to your account</p>
            </div>
            
            <div class="auth-card">
                <button type="button" class="auth-button-outline" id="google-login-btn">
                    <svg class="icon-google" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4" />
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-separator">
                    <div class="auth-separator-line">
                        <div></div>
                    </div>
                    <div class="auth-separator-text">
                        <span>or</span>
                    </div>
                </div>

                <div id="login-error" class="auth-error hidden">
                    Invalid email or password
                </div>

                <form id="login-form" class="auth-form">
                    <div class="auth-form-group">
                        <label for="email" class="auth-label">Email</label>
                        <div class="auth-input-relative">
                            <i data-lucide="mail" class="auth-input-icon"></i>
                            <input
                                id="email"
                                type="email"
                                autocomplete="email"
                                autofocus
                                placeholder="you@example.com"
                                required
                                class="auth-input"
                            >
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <div class="auth-label-row">
                            <label for="password" class="auth-label">Password</label>
                            <a href="forgot-password.html" class="auth-link-sm">Forgot password?</a>
                        </div>
                        <div class="auth-input-relative">
                            <i data-lucide="lock" class="auth-input-icon"></i>
                            <input
                                id="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="••••••••"
                                required
                                class="auth-input"
                            >
                        </div>
                    </div>

                    <button type="submit" class="auth-button" id="login-btn">
                        <span id="login-btn-text">Log in</span>
                        <div id="login-spinner" class="hidden">
                            <i data-lucide="loader-2" class="animate-spin" style="width:1rem;height:1rem;margin-right:0.5rem"></i>
                            Logging in...
                        </div>
                    </button>
                </form>
            </div>
            
            <p class="auth-footer">
                Don't have an account? <a href="register.html" class="auth-link">Create one</a>
            </p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
