<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYRA - Canecas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-category="canecas">
    <main>
        <!-- Category Hero Section -->
        <section class="category-hero">
            <img src="https://media.base44.com/images/public/6a6110c7082124fafbd842f3/a7eacf785_generated_c5865baa.png"
                class="category-hero-bg" alt="Canecas">
            <div class="category-hero-overlay"></div>

            <div class="category-hero-content">
                <h1 class="font-display">Canecas</h1>
                <p>Cerâmica artesanal de alta qualidade. Objeto de design consciente.</p>
            </div>
        </section>

        <!-- No Marquee Section for Canecas -->

        <!-- Catalog Section -->
        <section class="catalog-section">
            <div class="container catalog-layout">
                <!-- Sidebar Filters -->
                <aside class="sidebar-filters" id="filters-container">
                    <!-- Filters injected via JS -->
                </aside>

                <!-- Product Grid -->
                <div class="catalog-grid-container">
                    <div class="vitrine-grid" id="category-products">
                        <!-- Products injected via JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
